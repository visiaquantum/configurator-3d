name: Verify configurator

# Pull requests run once; pushes only for main (the merge result).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The library has no runtime dependencies of its own: audit the whole dev tree.
      - run: npm audit --audit-level=high
      - run: npm run lint -- --max-warnings=0
      # Builds the library, checks the bundle budget, runs unit tests with coverage floors and the GLB verifiers.
      - run: npm test
      - run: npm run build:demo
      # Browser checks of the integration page, WebGL rendered in software.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The consumer example installs the packed tarball and type-checks against
      # the published declarations, as a host project would.
      - run: npm run example:prepare
      - run: npm ci --no-audit --no-fund
        working-directory: examples/react-integration
      - run: npm run build
        working-directory: examples/react-integration
